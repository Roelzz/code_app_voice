[project]
name = "voice-broker"
version = "0.1.0"
description = "Mints short-lived Azure OpenAI realtime tokens for DFMEA Workshop Studio voice mode."
requires-python = ">=3.12,<3.13"
dependencies = [
    "azure-functions>=1.26.0",
    "azure-identity>=1.27.0",
    "loguru>=0.7.3",
]

[tool.uv]
package = false

[[tool.uv.index]]
url = "https://packagefeedproxy.microsoft.io/pypi/simple"
default = true

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
line-length = 140
target-version = "py312"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]
